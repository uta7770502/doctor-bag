<header><div></div><div class="title"><b>お医者さんカバン</b><i></i></div><button class="gear">⚙</button></header>
<section id="home" class="screen active"><p class="lead">気になる症状を選んでください</p><button class="urgentHero" id="emergency"><span class="ambulance">✚</span><span><strong>今すぐ受診が必要な<br>緊急の症状がありますか？</strong><small>命に関わる可能性のある症状はこちら</small></span><em>緊急の症状<br>を確認する　›</em></button><div id="homeChoices" class="homegrid"></div></section>
<section id="flow" class="screen"><div class="flowhead"><button id="back">‹</button><div><small id="step"></small><h2 id="question"></h2></div></div><div class="progress"><i></i><i></i><i></i></div><div id="choices" class="choices"></div></section>
